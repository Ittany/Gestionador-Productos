<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Productos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>📦 Gestión de Productos</h1>
  </header>

  <main>
    <!-- Formulario -->
    <section class="card">
      <h2 id="form-title">Nuevo producto</h2>
      <form id="producto-form">
        <input type="hidden" id="producto-id" />
        
        <label>Nombre:
          <input type="text" id="nombre" required />
        </label>
        <label>Descripción:
          <input type="text" id="descripcion" />
        </label>
        <label>Precio:
          <input type="number" id="precio" step="0.01" min="0" required />
        </label>
        <label>Stock:
          <input type="number" id="stock" min="0" value="0" required />
        </label>
        
        <div class="actions">
          <button type="submit" id="btn-guardar">Guardar</button>
          <button type="button" id="btn-cancelar" class="secondary" hidden>Cancelar</button>
        </div>
      </form>
      <p id="mensaje" class="mensaje"></p>
    </section>

    <!-- Tabla -->
    <section class="card">
      <h2>Lista de productos</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Nombre</th><th>Descripción</th>
            <th>Precio</th><th>Stock</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="6">Cargando...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
